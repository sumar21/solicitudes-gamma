# Alimenta la base de TESTING (enrich de camas) pegándole al deployment Preview
# de la rama `develop`.
#
# ¿Por qué un GitHub Action y no un Vercel Cron? Los Vercel Cron de vercel.json corren
# SOLO contra Production (rama main / ENTORNO=PRODUCTIVO). El deployment Preview de
# `develop` (ENTORNO=TESTING) nunca dispara esos crons, así que sus filas
# `Entorno_EC = 'TESTING'` en 12.EnrichCamas quedarían stale. Este job externo las refresca.
#
# IMPORTANTE: los workflows con `schedule` solo se programan desde el archivo en la rama
# DEFAULT del repo (main). Este .yml tiene que estar mergeado en main para que el cron
# se active — aunque lo que hace es pegarle al Preview de develop.
#
# Requiere 2 secrets de repo (Settings → Secrets and variables → Actions):
#   · TESTING_BASE_URL  → alias estable del Preview de develop, sin barra final.
#                         Ej: https://solicitudes-gamma-git-develop-<scope>.vercel.app
#   · CRON_SECRET       → el mismo valor que la env var CRON_SECRET del proyecto (scope Preview).
#
# (El Preview no tiene Deployment Protection, así que no hace falta bypass de Vercel.)

name: Enrich TESTING beds

on:
  schedule:
    # Cada 15 min, desfasado de Production (0,15,30,45) para no escribir en SharePoint
    # al mismo tiempo. Nota: el scheduler de GitHub Actions es best-effort y puede
    # demorarse varios minutos bajo carga — suficiente para un entorno de testing.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

# Si dos corridas se solapan (una demorada + la siguiente), cancelamos la vieja:
# el cron es idempotente, no tiene sentido pisar SharePoint dos veces en paralelo.
concurrency:
  group: enrich-testing
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron-enrich-beds (Preview / TESTING)
        env:
          TESTING_BASE_URL: ${{ secrets.TESTING_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${TESTING_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Faltan secrets TESTING_BASE_URL y/o CRON_SECRET"
            exit 1
          fi

          url="${TESTING_BASE_URL%/}/api/cron-enrich-beds"
          echo "POST $url"

          # maxDuration del endpoint es 300s → damos margen con --max-time 320.
          # -w captura el status; el body queda en /tmp/out.json para el log.
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "$url" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --max-time 320)

          echo "HTTP $code"
          echo "----- response -----"
          cat /tmp/out.json || true
          echo
          echo "--------------------"

          if [ "$code" != "200" ]; then
            echo "::error::cron-enrich-beds devolvió HTTP $code (esperado 200)"
            exit 1
          fi
