name: Check diet changes

# Cron job que detecta cambios de dieta en PROGAL (vía Gamma) y dispara push
# a Catering del piso correspondiente. Corre cada 30 min.
#
# Setup:
#   1. Crear lista 11.DietaSnapshot en SP con las columnas documentadas.
#   2. Cargar en Vercel envs:
#        DIETA_SNAPSHOT_LIST_ID (GUID de la lista)
#        CRON_SECRET (string aleatorio largo)
#   3. Cargar en GitHub repo Secrets (Settings → Secrets and variables → Actions):
#        CRON_SECRET (mismo valor que en Vercel)
#        MEDIFLOW_URL (ej: https://mediflow.vercel.app)
#   4. Mergear este archivo a main. El workflow se activa automáticamente.

on:
  schedule:
    - cron: '*/30 * * * *' # cada 30 min — GitHub puede tener delays de hasta 15 min
  workflow_dispatch:        # permite disparar manualmente desde la UI de Actions

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call check-diet-changes endpoint
        run: |
          set -e
          response=$(curl -fsS -w "\n%{http_code}" -X POST \
            "${{ secrets.MEDIFLOW_URL }}/api/cron-diet-changes" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::endpoint devolvió status $status"
            exit 1
          fi
